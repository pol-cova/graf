name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tectonic
        run: |
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo install tectonic /usr/local/bin/tectonic
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the core XCFramework and Swift bindings
        run: GRAF_CORE_PROFILE=dev ./scripts/build_core_xcframework.sh
      - run: swift build --package-path apple
      - run: swift test --package-path apple
      # The configuration that ships. Release builds differ from debug, and
      # there is no other platform to fall back on, so it is checked here
      # rather than first on a tag push.
      - name: Build the release configuration
        run: swift build --package-path apple -c release --product Graf
      - name: Assemble the app bundle
        # No signing identity, so build_app.sh falls back to an ad-hoc
        # signature; --no-dmg skips packaging. This covers bundling without
        # needing the release certificates, which only CI can use.
        env:
          GRAF_SKIP_COMPILERS: "1"
        run: ./scripts/build_app.sh --no-dmg
      - name: Verify the bundle is complete and executable
        run: |
          app="target/release/bundle/Graf.app"
          test -x "$app/Contents/MacOS/Graf"
          test -f "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/AppIcon.icns"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Launch it the way a user does, then confirm it actually came up.
          # A release build that cannot open a window reaches users first.
          "$app/Contents/MacOS/Graf" &
          pid=$!
          sleep 5
          kill "$pid" 2>/dev/null || true
          # Exited 0 (clean quit) or 143 (SIGTERM) both mean it stayed up
          # for the whole window instead of crashing on launch.
          wait "$pid" 2>/dev/null; code=$?
          test "$code" = 0 -o "$code" = 143
