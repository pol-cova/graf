name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: graf version
      placeholder: 1.0.0-alpha
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system, version, and hardware
    validations:
      required: true
  - type: dropdown
    id: document
    attributes:
      label: Document type
      options: [LaTeX, Typst, Plain text, Canvas, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
