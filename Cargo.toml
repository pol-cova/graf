[package]
name = "graf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "Graf"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
tempfile = "3.14"

[profile.profiling]
inherits = "release"
debug = true

